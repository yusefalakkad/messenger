version: '3.8'

name: messenger

services:
  backend:
    build:
      context: .
      target: backend
    container_name: messenger_backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file: .env
    environment:
      # SECURITY: НЕТ ${...:-fallback} — fail-fast если .env не задан. Лучше упасть,
      # чем запуститься с известным дефолтом.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MINIO_ENDPOINT: minio
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: .
      target: nginx-frontend
    container_name: messenger_nginx
    restart: unless-stopped
    # SECURITY: non-root nginx внутри слушает на 8080/8443.
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Десктоп-установщики (.dmg/.exe) раздаются по /download/.
      # Бинарники не в git/образе — кладутся на хост через tools/publish-desktop.sh.
      - ./nginx/download:/usr/share/nginx/html/download:ro
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=50
      -c wal_buffers=8MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # SECURITY: бинд на 127.0.0.1 — снаружи VPS НЕДОСТУПНО. Доступ только через
    # внутреннюю docker-сеть (backend) или SSH-туннель с операторской машины.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: messenger_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # SECURITY: бинд на 127.0.0.1 — снаружи VPS НЕДОСТУПНО.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: messenger_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # SECURITY: бинд на 127.0.0.1 — admin-консоль (:9001) НЕДОСТУПНА из интернета.
    # Backend ходит на minio:9000 через docker-сеть. Для доступа к консоли — SSH-туннель.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  coturn:
    image: coturn/coturn:latest
    container_name: messenger_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      # REST-аутентификация (приоритет). Долгоживущий секрет — общий с backend.
      TURN_SECRET: ${TURN_SECRET}
      # Legacy static creds (используется только если TURN_SECRET пуст)
      TURN_USER: ${TURN_USER:-}
      TURN_PASS: ${TURN_PASS:-}
      TURN_REALM: ${TURN_REALM:-dakka}
      SERVER_IP: ${SERVER_IP}
      # TLS (опционально)
      TURN_TLS_CERT: ${TURN_TLS_CERT:-}
      TURN_TLS_KEY: ${TURN_TLS_KEY:-}

  # ── LiveKit SFU ──────────────────────────────────────────────────────────────
  # Selective Forwarding Unit для групповых звонков (до 8 участников).
  # 1-на-1 звонки идут через прямой peer-to-peer WebRTC (CallOverlay + coturn).
  # LiveKit подключается отдельно через POST /api/livekit/token + livekit-client.
  #
  # Конфиг — livekit/livekit.yaml. Использует ${LIVEKIT_API_KEY}/${LIVEKIT_API_SECRET}
  # через переменные окружения (livekit-server подхватывает их через envsubst-стиль
  # синтаксис ${VAR}).
  livekit:
    image: livekit/livekit-server:latest
    container_name: messenger_livekit
    # on-failure:0 = НЕ рестартим при провале (опциональный сервис).
    # Если LIVEKIT_API_KEY/SECRET не заданы — сервис падает, но это нормально:
    # nginx использует lazy DNS, /livekit endpoint просто вернёт 502, основной
    # сайт работает.
    restart: "no"
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_API_KEY:    ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    ports:
      # WS signaling API — проксируется nginx-ом наружу, локально только 127.0.0.1
      - "127.0.0.1:7880:7880"
      # ICE/TCP fallback — для клиентов за рестриктивным NAT
      - "127.0.0.1:7881:7881"
      # UDP-диапазон для RTC-медиа. Должен быть открыт наружу.
      - "50000-50099:50000-50099/udp"
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge
