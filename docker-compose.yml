version: '3.8'

name: messenger

services:
  backend:
    build:
      context: .
      target: backend
    container_name: messenger_backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger_secret}@postgres:5432/${POSTGRES_DB:-messenger_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      MINIO_ENDPOINT: minio
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  nginx:
    build:
      context: .
      target: nginx-frontend
      args:
        VITE_TURN_URL: ${SERVER_IP}:3478
        VITE_TURN_USER: ${TURN_USER:-turnuser}
        VITE_TURN_PASS: ${TURN_PASS:-turnpass123}
    container_name: messenger_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=50
      -c wal_buffers=8MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c checkpoint_completion_target=0.9
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger_secret}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: messenger_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  minio:
    image: minio/minio:latest
    container_name: messenger_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret123}
    volumes:
      - minio_data:/data
    networks:
      - app-network

  coturn:
    image: coturn/coturn:latest
    container_name: messenger_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      TURN_USER: ${TURN_USER:-turnuser}
      TURN_PASS: ${TURN_PASS:-turnpass123}
      TURN_REALM: ${TURN_REALM:-dakka}
      SERVER_IP: ${SERVER_IP}

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge
