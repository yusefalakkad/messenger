<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17151e" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA / iOS Add-to-Homescreen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dakka" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- Бутстрап темы ДО первого пейнта: ставит data-theme на <html> и фон,
         чтобы не было вспышки чужой темы. Должно выполниться синхронно. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('theme') || 'dark';
          var actual = m === 'auto'
            ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : (m === 'light' ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', actual);
          var bg = actual === 'light' ? '#f4f2f7' : '#17151e';
          document.documentElement.style.backgroundColor = bg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', bg);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=3" />
    <title>Dakka</title>
  </head>
  <body class="bg-dark-bg text-content antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
