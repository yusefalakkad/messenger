# nginx-unprivileged (non-root uid 101) не может писать в /run/nginx.pid.
# Кладём pidfile и temp-файлы в /tmp где у uid 101 есть write-доступ.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;          # не палим версию nginx

    # ── Body limits ────────────────────────────────────────────────────────────
    # 1MB default — JSON-эндпоинты не должны принимать большие тела.
    # Для /api/media/ перебиваем локально (110MB).
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # ── Edge rate-limiting ─────────────────────────────────────────────────────
    # Защищает Express-rate-limit от Slowloris/connection-exhaustion ДО входа в Node.
    limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # ─── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 8080;
        # 301 forever — HSTS preload list совместимо
        return 301 https://$host$request_uri;
    }

    # ─── Main HTTPS ───────────────────────────────────────────────────────────
    server {
        listen 8443 ssl;
        http2 on;

        # ── TLS hardening (Mozilla Intermediate) ──────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        # ssl_stapling on; # включить когда cert от LE, не self-signed
        # ssl_stapling_verify on;
        # ssl_trusted_certificate /etc/nginx/ssl/cert.pem;
        # resolver 1.1.1.1 9.9.9.9 valid=300s;

        # ── Security headers (выставляем на ВСЕ ответы, в т.ч. на index.html) ─
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY"                                          always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "geolocation=(), camera=(self), microphone=(self), interest-cohort=()" always;
        # CSP: 'unsafe-inline' для style нужен для tailwind/lucide. JS строго self.
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # ── Connection-level ─────────────────────────────────────────────────
        limit_conn conn_zone 50;

        root /usr/share/nginx/html;
        index index.html;

        # ── API ──────────────────────────────────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /api/media/ {
            # Большие тела разрешаем ТОЛЬКО на медиа-эндпоинт
            client_max_body_size 110m;
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Socket.io WebSocket ──────────────────────────────────────────────
        location /socket.io {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
        }

        # ── LiveKit signaling (WebSocket) ────────────────────────────────────
        # Клиенты подключаются через wss://akkdmsg.online/livekit (livekit-client
        # SDK) и обмениваются SDP/ICE по WS. Сам медиа-трафик идёт напрямую UDP
        # 50000-50099 (или TCP 7881 как fallback), nginx-у его проксировать НЕ
        # нужно — нужен только WS-канал управления.
        #
        # Используем переменную + docker DNS resolver — это даёт LAZY-резолв
        # имени. Если livekit-контейнер не запущен (например ключи API_KEY/SECRET
        # не заданы и контейнер не стартует), nginx ВСЁ РАВНО стартует и работает;
        # только /livekit вернёт 502. Без этого fix nginx падал бы на старте
        # с "host not found in upstream", если livekit недоступен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        location /livekit {
            set $livekit_upstream "http://livekit:7880";
            rewrite ^/livekit(/.*)?$ $1 break;
            proxy_pass $livekit_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
