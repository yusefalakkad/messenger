# Security-заголовки — общий include.
#
# ВАЖНО (nginx-гочя): add_header НЕ наследуется в location, где есть СВОЙ
# add_header. Поэтому каждый такой location (/, /assets/, /download/) обязан
# подключить этот файл, иначе security-заголовки на его ответах пропадут.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY"                                          always;
add_header X-Content-Type-Options    "nosniff"                                       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
add_header Permissions-Policy        "geolocation=(), camera=(self), microphone=(self), interest-cohort=()" always;
# CSP: 'unsafe-inline' для style нужен для tailwind/lucide. JS строго self.
add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' data: blob: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
