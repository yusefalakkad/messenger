events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    limit_req_zone  $binary_remote_addr zone=auth_zone:10m rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=api_zone:10m  rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    # HTTP only — TLS терминируется Cloudflare Tunnel.
    # HSTS НЕ ставим, его выставляет Cloudflare. CSP/X-Frame/etc — ставим сами.
    server {
        listen 8080;
        server_name _;

        # Security headers (TLS=Cloudflare, поэтому HSTS опционально)
        add_header X-Frame-Options           "DENY"                                          always;
        add_header X-Content-Type-Options    "nosniff"                                       always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy        "geolocation=(), camera=(self), microphone=(self), interest-cohort=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        limit_conn conn_zone 50;

        root /usr/share/nginx/html;
        index index.html;

        location /api/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /api/media/ {
            client_max_body_size 110m;
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api_zone burst=50 nodelay;
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }

        location /socket.io {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
